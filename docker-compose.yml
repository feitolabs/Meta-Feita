services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meta-feita-backend
    ports:
      - "8000:8000"
    environment:
      - META_FEITA_ENV=development
      - META_FEITA_DATABASE_PATH=/app/data/meta_feita_monetization.db
      - META_FEITA_CATALOG_PATH=/app/catalog.json
      - META_FEITA_CORS_ORIGINS=http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080,http://localhost:5000
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
