# Blueprint do backend de monetização no Render.
# Valores com sync: false são pedidos no painel e nunca ficam no Git.
# Caminhos de Dockerfile e contexto são relativos à raiz do repositório.
services:
  - type: web
    name: meta-feita-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: META_FEITA_ENV
        value: production
      - key: META_FEITA_DATABASE_URL
        fromDatabase:
          name: meta-feita-db
          property: connectionString
      # Um proxy acrescenta o IP real ao fim de X-Forwarded-For.
      # Confirme nos logs do primeiro deploy; veja ANDROID_RELEASE.md.
      - key: META_FEITA_RATE_LIMIT_PROXY_HOPS
        value: "1"
      - key: META_FEITA_PLAY_VALIDATION_MODE
        value: google_play
      - key: META_FEITA_PLAY_PACKAGE_NAME
        value: com.feitolabs.meta_feita
      - key: META_FEITA_GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: META_FEITA_ADMOB_REWARDED_AD_UNITS
        sync: false
      - key: META_FEITA_CORS_ORIGINS
        sync: false

  # Devolve reservas pendentes e retira créditos de compras reembolsadas (a cada 6 horas).
  - type: cron
    name: meta-feita-manutencao
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.jobs.maintenance
    schedule: "0 */6 * * *"
    plan: 0.5c-512mb
    region: oregon
    envVars:
      - key: META_FEITA_ENV
        value: production
      - key: META_FEITA_DATABASE_URL
        fromDatabase:
          name: meta-feita-db
          property: connectionString
      - key: META_FEITA_PLAY_VALIDATION_MODE
        value: google_play
      - key: META_FEITA_PLAY_PACKAGE_NAME
        value: com.feitolabs.meta_feita
      - key: META_FEITA_GOOGLE_APPLICATION_CREDENTIALS
        sync: false

databases:
  - name: meta-feita-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
    # Só serviços da mesma conta e região conectam; o banco fica fora da internet.
    ipAllowList: []
